[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alpha-lab"
version = "0.1.0"
description = "Transparent quantitative investment research for paper portfolios"
requires-python = ">=3.12"
dependencies = [
  "numpy==2.1.3", "pandas==2.2.3", "pydantic==2.10.4", "PyYAML==6.0.2",
  "SQLAlchemy==2.0.36", "streamlit==1.50.0", "plotly==5.24.1", "yfinance==1.7.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["alpha_lab*"]
